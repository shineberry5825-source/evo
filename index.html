<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시스템 점검 중 - 곰돌이 보안 시스템</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            text-align: center;
            background: #1e293b;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            border: 1px solid #334155;
        }

        .icon-container {
            font-size: 52px;
            margin-bottom: 16px;
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        h1 {
            font-size: 21px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #ffffff;
            line-height: 1.4;
        }

        p {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .loading-dots span {
            animation: blink 1.4s infinite both;
            font-weight: bold;
            color: #38bdf8;
        }

        .loading-dots span:nth-child(2) { animation-delay: .2s; }
        .loading-dots span:nth-child(3) { animation-delay: .4s; }

        @keyframes blink {
            0% { opacity: .2; }
            20% { opacity: 1; }
            100% { opacity: .2; }
        }

        /* 프로그레스 바 영역 */
        .progress-box {
            background: #0f172a;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #334155;
            text-align: left;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 8px;
            color: #cbd5e1;
        }

        .progress-info span:last-child {
            color: #38bdf8;
            font-weight: 600;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background-color: #334155;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #0ea5e9, #38bdf8);
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .time-left {
            margin-top: 8px;
            font-size: 13px;
            color: #94a3b8;
            text-align: center;
        }

        .time-left strong {
            color: #f1f5f9;
        }

        /* 알람 신청 박스 스타일 */
        .alarm-box {
            background: #111827;
            padding: 18px;
            border-radius: 12px;
            border: 1px solid #374151;
            margin-bottom: 20px;
            text-align: center;
        }

        .alarm-text {
            font-size: 14px;
            color: #e2e8f0;
            margin-bottom: 14px;
            line-height: 1.5;
        }

        .alarm-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            flex: 1;
            padding: 10px 0;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            border: none;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-yes {
            background-color: #0284c7;
            color: white;
        }

        .btn-yes:hover {
            background-color: #0369a1;
        }

        .btn-no {
            background-color: #334155;
            color: #94a3b8;
        }

        .btn-no:hover {
            background-color: #475569;
            color: #f1f5f9;
        }

        .alarm-result {
            font-size: 13px;
            color: #38bdf8;
            margin-top: 10px;
            display: none;
            font-weight: 600;
        }

        .footer {
            font-size: 13px;
            color: #64748b;
            border-top: 1px solid #334155;
            padding-top: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon-container">🐻🛡️</div>
        <h1>곰돌이가 현재 보안 프로그램을<br>서버에 설치하고 있습니다</h1>
        <p>
            더 안전하고 안정적인 서비스 제공을 위해<br>
            서버 보안 업데이트 작업을 진행 중입니다
            <span class="loading-dots"><span>.</span><span>.</span><span>.</span></span>
        </p>

        <!-- 프로그레스 바 및 남은 시간 -->
        <div class="progress-box">
            <div class="progress-info">
                <span>설치 진행률</span>
                <span id="percent-text">0%</span>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
            <div class="time-left">
                남은 예상 시간: <strong id="time-text">계산 중...</strong>
            </div>
        </div>

        <!-- 알람 신청 영역 -->
        <div class="alarm-box">
            <div class="alarm-text">
                작업이 끝나는 대로, 메인 프로그램으로 연결됩니다.<br>
                작업이 끝나면 알람을 보내드릴까요?
            </div>
            <div class="alarm-buttons" id="alarm-buttons-group">
                <button class="btn btn-yes" onclick="clickAlarm(true)">예</button>
                <button class="btn btn-no" onclick="clickAlarm(false)">아니오</button>
            </div>
            <div class="alarm-result" id="alarm-result-text"></div>
        </div>

        <div class="footer">
            &copy; SHINING BERRY. All rights reserved.
        </div>
    </div>

    <script>
        // 1. 타이머 관련 로직
        // 2026년 10월 29일 오전 10시 00분 00초
        const targetTimestamp = new Date('2026-10-29T10:00:00').getTime();
        const startTimestamp = new Date().getTime();
        const totalDuration = targetTimestamp - startTimestamp;

        function runTimer() {
            const now = new Date().getTime();
            const timeLeft = targetTimestamp - now;

            const fillEl = document.getElementById('progress-fill');
            const percentEl = document.getElementById('percent-text');
            const timeTextEl = document.getElementById('time-text');

            if (!fillEl || !percentEl || !timeTextEl) return;

            if (timeLeft <= 0) {
                fillEl.style.width = '100%';
                percentEl.innerText = '100%';
                timeTextEl.innerText = '설치 완료!';
                return;
            }

            // 남은 시간 계산 (일, 시간, 분, 초)
            const days = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
            const hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);

            let timeStr = '';
            if (days > 0) timeStr += `${days}일 `;
            if (hours > 0 || days > 0) timeStr += `${hours}시간 `;
            timeStr += `${minutes}분 ${seconds}초`;

            timeTextEl.innerText = timeStr;

            // 프로그레스 바 퍼센트 계산
            let elapsed = now - startTimestamp;
            let percent = (elapsed / totalDuration) * 100;
            if (percent < 0) percent = 0;
            if (percent > 99) percent = 99;

            fillEl.style.width = percent.toFixed(1) + '%';
            percentEl.innerText = Math.floor(percent) + '%';
        }

        // 2. 알람 버튼 클릭 함수 (인라인 onclick과 확실하게 연동되도록 전역 등록)
        window.clickAlarm = function(isAgree) {
            const group = document.getElementById('alarm-buttons-group');
            const result = document.getElementById('alarm-result-text');

            if (group) group.style.display = 'none';
            if (result) {
                result.style.display = 'block';
                if (isAgree) {
                    result.innerText = "✓ 작업이 완료되면 자동으로 알람을 발송해 드립니다.";
                } else {
                    result.innerText = "알람 신청이 취소되었습니다.";
                    result.style.color = "#94a3b8";
                }
            }
        };

        // 페이지 로드 시 즉시 실행 및 1초 반복
        runTimer();
        setInterval(runTimer, 1000);
    </script>

</body>
</html>
