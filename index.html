<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>삼성전자 반도체부문 임직원 보안시스템</title>

  <!-- 삼성 로고 형태 SVG 파비콘 (로컬 실행 시에도 표시되도록 data URI 적용) -->
  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231428A0'/%3E%3Cellipse cx='32' cy='32' rx='24' ry='11' transform='rotate(-12 32 32)' fill='none' stroke='%23FFFFFF' stroke-width='2.5'/%3E%3Ctext x='32' y='37' text-anchor='middle' fill='%23FFFFFF' font-family='Arial, sans-serif' font-size='11' font-weight='800' letter-spacing='0.5'%3ESAMSUNG%3C/text%3E%3C/svg%3E"
  />

  <style>
    :root {
      --samsung-blue: #1428a0;
      --samsung-blue-dark: #0c1966;
      --samsung-blue-light: #eef2ff;
      --bg-page: #f4f6fa;
      --bg-card: #ffffff;
      --text-primary: #111827;
      --text-secondary: #4b5563;
      --text-muted: #6b7280;
      --border-color: #d1d5db;
      --border-focus: #1428a0;
      --danger-bg: #fef2f2;
      --danger-border: #fecaca;
      --danger-text: #b91c1c;
      --warning-bg: #fffbeb;
      --warning-border: #fde68a;
      --warning-text: #92400e;
      --shadow-card: 0 12px 32px rgba(20, 40, 160, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* 초기 로딩 화면 */
    .splash-screen {
      position: fixed;
      inset: 0;
      background: linear-gradient(160deg, #0b165c 0%, #1428a0 55%, #1d39c4 100%);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 24px;
      text-align: center;
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }

    .splash-screen.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-logo-wrap {
      margin-bottom: 24px;
    }

    .samsung-wordmark {
      font-size: clamp(28px, 6vw, 42px);
      font-weight: 800;
      letter-spacing: 0.14em;
      color: #ffffff;
      display: inline-block;
      padding: 10px 26px;
      border: 2px solid rgba(255, 255, 255, 0.55);
      border-radius: 999px;
    }

    .splash-title {
      font-size: clamp(18px, 3.6vw, 24px);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.45;
      margin-bottom: 10px;
    }

    .splash-subtitle {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.78);
      margin-bottom: 28px;
    }

    .loader-bar {
      width: 220px;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      overflow: hidden;
    }

    .loader-bar-fill {
      height: 100%;
      width: 0%;
      background: #ffffff;
      border-radius: 999px;
      animation: loadingProgress 1.6s ease-in-out forwards;
    }

    @keyframes loadingProgress {
      0% { width: 0%; }
      65% { width: 78%; }
      100% { width: 100%; }
    }

    /* 메인 로그인 컨테이너 */
    .login-wrapper {
      width: 100%;
      max-width: 420px;
      background: var(--bg-card);
      border: 1px solid #e5e7eb;
      border-top: 4px solid var(--samsung-blue);
      border-radius: 14px;
      box-shadow: var(--shadow-card);
      padding: 32px 28px;
    }

    .brand-header {
      margin-bottom: 24px;
    }

    .brand-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--samsung-blue);
      background: var(--samsung-blue-light);
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .brand-heading {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .brand-desc {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      height: 46px;
      padding: 0 14px;
      font-size: 14px;
      color: var(--text-primary);
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(20, 40, 160, 0.12);
    }

    .btn-login {
      width: 100%;
      height: 48px;
      margin-top: 6px;
      background-color: var(--samsung-blue);
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-login:hover {
      background-color: var(--samsung-blue-dark);
    }

    /* 알림 영역 */
    .alert-box {
      margin-top: 20px;
      padding: 16px;
      border-radius: 10px;
      font-size: 13.5px;
      line-height: 1.55;
      display: none;
    }

    .alert-box.is-visible {
      display: block;
    }

    .alert-box--error {
      background-color: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: var(--danger-text);
      font-weight: 600;
    }

    .alert-box--location {
      background-color: var(--warning-bg);
      border: 1px solid var(--warning-border);
      color: var(--warning-text);
    }

    .alert-message {
      font-weight: 700;
      margin-bottom: 12px;
    }

    .btn-request-access {
      width: 100%;
      height: 42px;
      background-color: #ffffff;
      color: var(--samsung-blue);
      border: 1.5px solid var(--samsung-blue);
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .btn-request-access:hover {
      background-color: var(--samsung-blue);
      color: #ffffff;
    }

    .request-status {
      margin-top: 10px;
      font-size: 12.5px;
      color: var(--text-secondary);
      display: none;
    }

    .request-status.is-visible {
      display: block;
    }
  </style>
</head>
<body>
  <!-- 1. 초기 로딩 화면 -->
  <div id="splashScreen" class="splash-screen" aria-live="polite">
    <div class="splash-logo-wrap">
      <span class="samsung-wordmark">SAMSUNG</span>
    </div>
    <h1 class="splash-title">삼성전자 반도체부문 임직원 보안시스템</h1>
    <p class="splash-subtitle">보안 접속 환경을 확인하고 있습니다...</p>
    <div class="loader-bar" aria-hidden="true">
      <div class="loader-bar-fill"></div>
    </div>
  </div>

  <!-- 2. 메인 로그인 화면 -->
  <main class="login-wrapper" aria-label="임직원 로그인">
    <header class="brand-header">
      <span class="brand-tag">SAMSUNG DS SECURITY</span>
      <h2 class="brand-heading">임직원 보안 로그인</h2>
      <p class="brand-desc">사번과 비밀번호를 입력하여 보안 시스템에 접속하세요.</p>
    </header>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="employeeId" class="form-label">사번</label>
        <input
          type="text"
          id="employeeId"
          name="employeeId"
          class="form-input"
          placeholder="사번을 입력하세요"
          autocomplete="username"
          required
        />
      </div>

      <div class="form-group">
        <label for="password" class="form-label">비밀번호</label>
        <input
          type="password"
          id="password"
          name="password"
          class="form-input"
          placeholder="비밀번호를 입력하세요"
          autocomplete="current-password"
          required
        />
      </div>

      <button type="submit" class="btn-login">로그인</button>
    </form>

    <!-- 미등록 사용자 안내 -->
    <div id="unknownUserAlert" class="alert-box alert-box--error" role="alert">
      존재하지 않는 사용자입니다
    </div>

    <!-- 근무지 외 접속 차단 안내 및 별도 사용 허가 요청 -->
    <div id="locationBlockAlert" class="alert-box alert-box--location" role="alert">
      <p class="alert-message">이준용 사원님의 현재 접속 위치가 근무지가 아니므로 접속할 수 없습니다</p>
      <button type="button" id="requestAccessBtn" class="btn-request-access">
        별도 사용 허가 요청하기
      </button>
      <p id="requestStatusText" class="request-status">
        별도 사용 허가 요청 화면 연결 준비가 완료되었습니다. (다음 단계에서 이어서 구성됩니다.)
      </p>
    </div>
  </main>

  <script>
    const VALID_ID = "sm941121";
    const VALID_PW = "!lee08217!";

    const splashScreen = document.getElementById("splashScreen");
    const loginForm = document.getElementById("loginForm");
    const employeeIdInput = document.getElementById("employeeId");
    const passwordInput = document.getElementById("password");
    const unknownUserAlert = document.getElementById("unknownUserAlert");
    const locationBlockAlert = document.getElementById("locationBlockAlert");
    const requestAccessBtn = document.getElementById("requestAccessBtn");
    const requestStatusText = document.getElementById("requestStatusText");

    // 로딩 화면 자동 전환
    window.addEventListener("DOMContentLoaded", () => {
      setTimeout(() => {
        splashScreen.classList.add("is-hidden");
        employeeIdInput.focus();
      }, 1700);
    });

    function hideAllAlerts() {
      unknownUserAlert.classList.remove("is-visible");
      locationBlockAlert.classList.remove("is-visible");
      requestStatusText.classList.remove("is-visible");
    }

    loginForm.addEventListener("submit", (event) => {
      event.preventDefault();
      hideAllAlerts();

      const enteredId = employeeIdInput.value.trim();
      const enteredPw = passwordInput.value;

      if (enteredId === VALID_ID && enteredPw === VALID_PW) {
        locationBlockAlert.classList.add("is-visible");
      } else {
        unknownUserAlert.classList.add("is-visible");
      }
    });

    requestAccessBtn.addEventListener("click", () => {
      requestStatusText.classList.add("is-visible");
    });
  </script>
</body>
</html>
